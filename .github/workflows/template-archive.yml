name: Template archive integrity
on:
  push:
    branches: [library-of-free-virtual-machines-spreadsheet-template]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate archive structure (not workbook qualification)
        run: python3 scripts/validate_archive.py
