name: LFVM foundation metadata and regression checks
on:
  push:
    branches: [library-of-free-virtual-machines-spreadsheet-library]
  pull_request:
    branches: [library-of-free-virtual-machines-spreadsheet-library]
permissions:
  contents: read
jobs:
  foundation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node 24
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Record runtime
        run: python --version
      - name: Validate archive and exact CI identity
        run: python -B scripts/validate_library_archive.py --ci
      - name: Normal regression suite
        run: python -B -m unittest discover -s tests -v
      - name: Optimized regression suite
        run: python -O -B -m unittest discover -s tests -v
      - name: Optimized archive gate
        run: python -O -B scripts/validate_library_archive.py --ci
